<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferramentas · Lumere Downloader</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="ferramentas.css">
</head>
<body>
  <header class="top">
    <button id="home" class="brand" title="Todas as ferramentas">
      <img src="icons/icon32.png" alt="" width="22" height="22">
      <span>Ferramentas</span>
    </button>
    <span class="private" title="Nenhum arquivo sai do seu computador">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      100% local
    </span>
    <span class="grow"></span>
    <button id="fullscreen" class="ghost" hidden title="Abrir em uma aba">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      Tela cheia
    </button>
  </header>

  <div class="layout">
    <nav id="nav" class="nav"></nav>
    <main id="view" class="view"></main>
  </div>

  <!-- bibliotecas (globais) -->
  <script src="lib/pdf-lib.min.js"></script>
  <script src="lib/jszip.min.js"></script>
  <script src="lib/pako.min.js"></script>
  <script src="lib/UPNG.js"></script>
  <script src="lib/qrcode.js"></script>
  <script type="module" src="ferramentas.js"></script>
</body>
</html>
